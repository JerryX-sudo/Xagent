name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: xagent-macos-arm64
            data_sep: ':'
          - os: macos-13
            artifact: xagent-macos-x86_64
            data_sep: ':'
          - os: windows-latest
            artifact: xagent-windows-x86_64
            data_sep: ';'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai anthropic rich pyyaml click diskcache tiktoken pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean \
            --onefile \
            --name "${{ matrix.artifact }}" \
            --add-data "assets${{ matrix.data_sep }}assets" \
            cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
