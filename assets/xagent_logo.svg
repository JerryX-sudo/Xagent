<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="200" cy="200" r="190" fill="white" stroke="black" stroke-width="4"/>
  
  <!-- X 字母设计 - 使用粗线条形成技术感 -->
  <g transform="translate(200,200)">
    <!-- X的第一条对角线 -->
    <path d="M -60,-60 L -20,-20 L 0,0 L 20,20 L 60,60" 
          stroke="black" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- X的第二条对角线 -->
    <path d="M 60,-60 L 20,-20 L 0,0 L -20,20 L -60,60" 
          stroke="black" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- 中心节点 - 代表Agent的核心 -->
    <circle cx="0" cy="0" r="15" fill="black"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    
    <!-- 连接点 - 代表网络和连接性 -->
    <circle cx="-60" cy="-60" r="8" fill="black"/>
    <circle cx="60" cy="-60" r="8" fill="black"/>
    <circle cx="-60" cy="60" r="8" fill="black"/>
    <circle cx="60" cy="60" r="8" fill="black"/>
    
    <!-- 轨道线 - 象征AI和数据流动 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="black" stroke-width="1" stroke-dasharray="10,5" opacity="0.2"/>
  </g>
  
  <!-- Agent 文字标识 -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="black">
    XAGENT
  </text>
  
  <!-- 副标题 -->
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="black" opacity="0.7">
    Intelligent Terminal Assistant
  </text>
  
  <!-- 装饰性元素 - 代表数据处理 -->
  <g transform="translate(200,200)">
    <!-- 左上象限的小方块 -->
    <rect x="-35" y="-35" width="8" height="8" fill="black" opacity="0.4"/>
    <!-- 右上象限的小方块 -->
    <rect x="27" y="-35" width="8" height="8" fill="black" opacity="0.4"/>
    <!-- 左下象限的小方块 -->
    <rect x="-35" y="27" width="8" height="8" fill="black" opacity="0.4"/>
    <!-- 右下象限的小方块 -->
    <rect x="27" y="27" width="8" height="8" fill="black" opacity="0.4"/>
  </g>
  
  <!-- 外框装饰线 -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="black" stroke-width="2" stroke-dasharray="20,10,5,10" opacity="0.2"/>
</svg>