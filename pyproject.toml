[project]
name = "xagent"
version = "0.1.0"
description = "A lightweight terminal Agent framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.20",
    "rich>=13.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "diskcache>=5.6",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
xagent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "llm", "tools", "memory", "plugins", "utils"]
include = ["cli.py", "__init__.py", "__main__.py"]
